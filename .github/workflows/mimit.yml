name: Aggiorna dati MIMIT

# Scarica i CSV open data del MIMIT e li pubblica nel ramo "data".
# L'app li legge da raw.githubusercontent.com (CORS aperto), così non
# dipende dal Worker Cloudflare, i cui server il MIMIT rifiuta (errore 522).
on:
  schedule:
    # il MIMIT pubblica l'estrazione delle 8 (ora italiana): più passaggi in mattinata
    # e uno a metà giornata, gli orari sono in UTC
    - cron: '20 6 * * *'
    - cron: '50 7 * * *'
    - cron: '20 9 * * *'
    - cron: '20 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mimit.yml']

permissions:
  contents: write

concurrency:
  group: mimit-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica CSV MIMIT
        run: |
          set -euo pipefail
          mkdir -p out
          get() {
            curl -fsSL --retry 5 --retry-delay 20 --retry-all-errors -m 180 \
              -A 'Carbur-PWA/1.0 (+open-data MIMIT)' \
              -o "out/$2" "https://www.mimit.gov.it/images/exportCSV/$1"
          }
          get prezzo_alle_8.csv prezzi.csv
          get anagrafica_impianti_attivi.csv anagrafica.csv
          for f in out/prezzi.csv out/anagrafica.csv; do
            size=$(wc -c < "$f")
            head -1 "$f"
            sed -n 2p "$f" | grep -q '|' || { echo "::error::$f: intestazione non valida"; exit 1; }
            [ "$size" -gt 500000 ] || { echo "::error::$f troppo piccolo ($size byte)"; exit 1; }
          done
          date -u +%Y-%m-%dT%H:%M:%SZ > out/updated.txt

      - name: Pubblica nel ramo data (senza storico, il repo non cresce)
        run: |
          set -euo pipefail
          cd out
          git init -q -b data
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Dati MIMIT: $(head -1 prezzi.csv)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
